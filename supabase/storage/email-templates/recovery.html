<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reset your password</title>
</head>
<body style="font-family: sans-serif; line-height: 1.5; color: #141204;">
  <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h1 style="color: #141204; margin-bottom: 20px;">Reset your password</h1>
    <p>Hello,</p>
    <p>We received a request to reset your password. Click the button below to choose a new password:</p>
    <p style="text-align: center;">
      <a href="${reset_url}" style="display: inline-block; padding: 12px 24px; background-color: #141204; color: #FFFFFC; text-decoration: none; border-radius: 4px;">
        Reset Password
      </a>
    </p>
    <p>If you didn't request a password reset, you can safely ignore this email.</p>
    <p>Best regards,<br>The Schrift.Digital Team</p>
  </div>
</body>
</html>
