<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Confirm your email address</title>
</head>
<body style="font-family: sans-serif; line-height: 1.5; color: #141204;">
  <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h1 style="color: #141204; margin-bottom: 20px;">Confirm your email address</h1>
    <p>Hello ${full_name},</p>
    <p>Please confirm your email address by clicking the button below:</p>
    <p style="text-align: center;">
      <a href="${confirmation_url}" style="display: inline-block; padding: 12px 24px; background-color: #141204; color: #FFFFFC; text-decoration: none; border-radius: 4px;">
        Confirm Email
      </a>
    </p>
    <p>If you didn't create an account with Schrift.Digital, you can safely ignore this email.</p>
    <p>Best regards,<br>The Schrift.Digital Team</p>
  </div>
</body>
</html>
