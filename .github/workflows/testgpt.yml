name: Sync Supabase Schema

on:
  workflow_dispatch: # manual trigger from GitHub UI

jobs:
  sync-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Supabase CLI
        run: |
          curl -sL https://github.com/supabase/cli/releases/latest/download/supabase-cli-linux-amd64 -o supabase
          chmod +x supabase
          sudo mv supabase /usr/local/bin/supabase

      - name: Login to Supabase
        run: supabase login --access-token ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Pull schema and metadata from remote DB
        run: supabase db pull

      - name: Commit and push updated schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations supabase/config.toml supabase/seed.sql
          git commit -m "chore: sync supabase schema from remote" || echo "No changes to commit"
          git push
