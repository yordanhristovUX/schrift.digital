name: Sync Supabase Schema

on:
  workflow_dispatch:

jobs:
  sync-schema:
    name: Pull Supabase Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Debug Supabase Access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "🔑 Checking if access token is set:"
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "✅ SUPABASE_ACCESS_TOKEN is set (length: ${#SUPABASE_ACCESS_TOKEN})"
          else
            echo "❌ SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          echo ""
          
          echo "🏗️ Checking if project ID is set:"
          if [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "✅ SUPABASE_PROJECT_ID is set: $SUPABASE_PROJECT_ID"
          else
            echo "❌ SUPABASE_PROJECT_ID is not set"
            exit 1
          fi
          echo ""

          echo "📋 Supabase CLI Version:"
          supabase --version
          echo ""

          echo "🔗 Linking project..."
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          echo ""

          echo "🔍 Testing basic Supabase CLI connectivity..."
          if supabase projects list 2>/dev/null | grep -q "$SUPABASE_PROJECT_ID"; then
            echo "✅ Can access project via CLI"
          else
            echo "⚠️ Cannot find project in projects list or access denied"
            echo "Available projects:"
            supabase projects list 2>/dev/null || echo "Failed to list projects"
          fi
          echo ""

          echo "📋 Attempting to list functions with verbose output..."
          echo "Command: supabase functions list --project-ref $SUPABASE_PROJECT_ID"
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" || echo "⚠️ Failed to list functions"

      - name: Pull latest DB schema from Supabase
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🔄 Pulling DB schema from remote..."
          
          DB_URL="postgresql://postgres:${DB_PASSWORD}@db.yzvecafbqesrgzhcqalq.supabase.co:5432/postgres"
          
          supabase db pull --db-url "$DB_URL"

      - name: Commit and push updated schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations supabase/config.toml supabase/seed.sql || true
          git diff --cached --quiet || git commit -m "chore: sync supabase schema from remote"
          git push
