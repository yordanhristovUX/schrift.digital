name: Deploy Supabase Edge Functions
on:
push:
branches:
- main
paths:
- 'supabase/functions/**'
workflow_dispatch: # Allow manual triggering
inputs:
force_sync:
description: 'Force complete sync (delete functions not in repo)'
required: false
default: 'true'
type: boolean

jobs:
deploy:
name: Deploy Supabase Edge Functions
runs-on: ubuntu-latest


steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 18

  - name: Setup Supabase CLI
    uses: supabase/setup-cli@v1
    with:
      version: latest

  - name: Check if functions directory exists
    id: check-functions
    run: |
      if [ -d "supabase/functions" ] && [ "$(ls -A supabase/functions)" ]; then
        echo "functions_exist=true" >> $GITHUB_OUTPUT
        echo "Functions directory exists and is not empty"
        ls -la supabase/functions/
      else
        echo "functions_exist=false" >> $GITHUB_OUTPUT
        echo "Functions directory is empty or doesn't exist"
      fi

  - name: Sync Edge Functions (Deploy and Delete)
    if: steps.check-functions.outputs.functions_exist == 'true'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      FORCE_SYNC: ${{ github.event.inputs.force_sync || 'true' }}
    run: |
      # Check if functions directory exists and has subdirectories
      if [ ! -d "supabase/functions" ] || [ ! "$(ls -A supabase/functions)" ]; then
        echo "No functions to deploy"
        exit 0
      fi
      
      echo "🔍 Getting list of deployed functions from Supabase..."
      
      # Get list of currently deployed functions
      deployed_functions=""
      if deployed_output=$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID" --output json 2>/dev/null); then
        # Parse JSON output to get function names
        deployed_functions=$(echo "$deployed_output" | jq -r '.[].name' 2>/dev/null | sort | uniq)
      elif deployed_output=$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID" 2>/dev/null); then
        # Fallback to table parsing if JSON fails
        deployed_functions=$(echo "$deployed_output" | tail -n +4 | awk '{print $4}' | grep -E '^[A-Za-z][A-Za-z0-9_-]*$' | sort | uniq)
      fi
      
      if [ -n "$deployed_functions" ]; then
        echo "📋 Currently deployed functions:"
        echo "$deployed_functions" | while read -r func; do
          if [ -n "$func" ]; then
            echo "  - $func"
          fi
        done
      else
        echo "⚠️ Could not retrieve deployed functions list (this is normal for first deployment)"
      fi
      
      echo ""
      echo "📁 Functions in repository:"
      
      # Get list of functions in repository (excluding _shared)
      repo_functions=""
      for dir in supabase/functions/*/; do
        if [ -d "$dir" ]; then
          func_name=$(basename "$dir")
          
          # Skip _shared directory
          if [ "$func_name" = "_shared" ]; then
            echo "  - $func_name (skipped - shared utilities)"
            continue
          fi
          
          # Validate function name format
          if [[ ! "$func_name" =~ ^[A-Za-z][A-Za-z0-9_-]*$ ]]; then
            echo "  - $func_name (skipped - invalid name format)"
            continue
          fi
          
          # Check if the function has an index.ts file
          if [ -f "$dir/index.ts" ]; then
            echo "  - $func_name"
            if [ -z "$repo_functions" ]; then
              repo_functions="$func_name"
            else
              repo_functions="$repo_functions\n$func_name"
            fi
          else
            echo "  - $func_name (skipped - no index.ts)"
          fi
        fi
      done
      
      echo ""
      
      # Deploy functions that exist in repository
      if [ -n "$repo_functions" ]; then
        echo "🚀 Deploying functions..."
        echo -e "$repo_functions" | while read -r func_name; do
          if [ -n "$func_name" ]; then
            echo "Deploying function: $func_name"
            if supabase functions deploy "$func_name" --project-ref "$SUPABASE_PROJECT_ID"; then
              echo "✅ Successfully deployed: $func_name"
            else
              echo "❌ Failed to deploy: $func_name"
              exit 1
            fi
          fi
        done
      else
        echo "ℹ️ No functions to deploy"
      fi
      
      echo ""
      
      # Delete functions that are deployed but not in repository (only if force sync is enabled)
      if [ "$FORCE_SYNC" = "true" ] && [ -n "$deployed_functions" ]; then
        echo "🗑️ Checking for functions to delete (force sync enabled)..."
        
        echo "$deployed_functions" | while read -r deployed_func; do
          if [ -n "$deployed_func" ]; then
            # Check if this deployed function exists in repository
            should_delete=true
            if [ -n "$repo_functions" ]; then
              if echo -e "$repo_functions" | grep -q "^$deployed_func$"; then
                should_delete=false
              fi
            fi
            
            # If function doesn't exist in repo, delete it from Supabase
            if [ "$should_delete" = true ]; then
              echo "🗑️ Deleting function not in repository: $deployed_func"
              if supabase functions delete "$deployed_func" --project-ref "$SUPABASE_PROJECT_ID"; then
                echo "✅ Successfully deleted: $deployed_func"
              else
                echo "⚠️ Failed to delete: $deployed_func (may not exist or permission issue)"
              fi
            fi
          fi
        done
      elif [ "$FORCE_SYNC" != "true" ]; then
        echo "ℹ️ Force sync disabled - skipping deletion of deployed functions not in repository"
      else
        echo "ℹ️ No deployed functions to check for deletion"
      fi
      
      echo ""
      echo "🎉 Function synchronization completed!"

  - name: Clean up all deployed functions
    if: steps.check-functions.outputs.functions_exist == 'false'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      FORCE_SYNC: ${{ github.event.inputs.force_sync || 'true' }}
    run: |
      if [ "$FORCE_SYNC" != "true" ]; then
        echo "ℹ️ Force sync disabled - skipping cleanup of deployed functions"
        exit 0
      fi
      
      echo "ℹ️ No functions found in supabase/functions directory."
      echo "🗑️ This will delete ALL deployed functions to maintain sync..."
      
      # Get list of currently deployed functions and delete them all
      deployed_functions=""
      if deployed_output=$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID" --output json 2>/dev/null); then
        # Parse JSON output to get function names
        deployed_functions=$(echo "$deployed_output" | jq -r '.[].name' 2>/dev/null | sort | uniq)
      elif deployed_output=$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID" 2>/dev/null); then
        # Fallback to table parsing if JSON fails
        deployed_functions=$(echo "$deployed_output" | tail -n +4 | awk '{print $4}' | grep -E '^[A-Za-z][A-Za-z0-9_-]*$' | sort | uniq)
      fi
      
      if [ -n "$deployed_functions" ]; then
        echo "Deleting all deployed functions:"
        echo "$deployed_functions" | while read -r func; do
          if [ -n "$func" ]; then
            echo "🗑️ Deleting: $func"
            if supabase functions delete "$func" --project-ref "$SUPABASE_PROJECT_ID"; then
              echo "✅ Successfully deleted: $func"
            else
              echo "⚠️ Failed to delete: $func"
            fi
          fi
        done
      else
        echo "ℹ️ No functions deployed to delete"
      fi
