name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Edge Function

    steps:
      - name: Debug - Show project ref
        run: echo "Project Ref is ${{ secrets.VITE_SUPABASE_URL }}"

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Deploy Supabase Edge Functions via NPX
        run: |
          cd supabase
          npx supabase functions deploy --project-ref ${{ secrets.VITE_SUPABASE_URL }} --token ${{ secrets.VITE_SUPABASE_ANON_KEY }}
