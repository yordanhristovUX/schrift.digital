name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy-migrations:
    name: Deploy Supabase Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🔍 Verifying required secrets..."
          
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "❌ SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          else
            echo "✅ SUPABASE_ACCESS_TOKEN is set"
          fi
          
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "❌ SUPABASE_PROJECT_ID is not set"
            exit 1
          else
            echo "✅ SUPABASE_PROJECT_ID is set: $SUPABASE_PROJECT_ID"
          fi
          
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "❌ SUPABASE_DB_PASSWORD is not set"
            exit 1
          else
            echo "✅ SUPABASE_DB_PASSWORD is set"
          fi

      - name: Check if migrations directory exists
        id: check-migrations
        run: |
          if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations)" ]; then
            echo "migrations_exist=true" >> $GITHUB_OUTPUT
            echo "Migrations directory exists and is not empty"
            echo "📁 Found migrations:"
            ls -la supabase/migrations/
          else
            echo "migrations_exist=false" >> $GITHUB_OUTPUT
            echo "Migrations directory is empty or doesn't exist"
          fi

      - name: Deploy Migrations
        if: steps.check-migrations.outputs.migrations_exist == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🚀 Starting migration deployment..."
          
          # Create a temporary supabase config to avoid interactive prompts
          mkdir -p .supabase
          cat > .supabase/config.toml << EOF
          [api]
          enabled = true
          port = 54321
          
          [db]
          enabled = true
          port = 54322
          
          [studio]
          enabled = true
          port = 54323
          
          [inbucket]
          enabled = true
          port = 54324
          
          [storage]
          enabled = true
          
          [auth]
          enabled = true
          
          [edge_runtime]
          enabled = true
          
          [functions]
          enabled = true
          
          [analytics]
          enabled = false
          EOF
          
          # Try linking with non-interactive mode
          echo "🔗 Linking to Supabase project..."
          
          # Method 1: Try with --password flag and stdin
          if echo "$SUPABASE_DB_PASSWORD" | supabase link --project-ref "$SUPABASE_PROJECT_ID" --password 2>/dev/null; then
            echo "✅ Successfully linked to project (Method 1)"
          else
            echo "⚠️ Method 1 failed, trying Method 2..."
            
            # Method 2: Try with expect to handle interactive prompt
            if command -v expect >/dev/null 2>&1; then
              expect << EOF
              spawn supabase link --project-ref "$SUPABASE_PROJECT_ID"
              expect "Enter your database password*"
              send "$SUPABASE_DB_PASSWORD\r"
              expect eof
          EOF
              
              if [ $? -eq 0 ]; then
                echo "✅ Successfully linked to project (Method 2)"
              else
                echo "⚠️ Method 2 failed, trying Method 3..."
                
                # Method 3: Try with environment variable approach
                export PGPASSWORD="$SUPABASE_DB_PASSWORD"
                if supabase link --project-ref "$SUPABASE_PROJECT_ID" --create-client 2>/dev/null; then
                  echo "✅ Successfully linked to project (Method 3)"
                else
                  echo "❌ All linking methods failed"
                  echo "💡 Troubleshooting tips:"
                  echo "  - Verify SUPABASE_PROJECT_ID: $SUPABASE_PROJECT_ID"
                  echo "  - Check if database password is correct"
                  echo "  - Ensure project exists and is accessible"
                  echo "  - Try resetting database password in Supabase dashboard"
                  exit 1
                fi
              fi
            else
              echo "⚠️ expect not available, trying Method 3..."
              
              # Method 3: Try with environment variable approach
              export PGPASSWORD="$SUPABASE_DB_PASSWORD"
              if supabase link --project-ref "$SUPABASE_PROJECT_ID" --create-client 2>/dev/null; then
                echo "✅ Successfully linked to project (Method 3)"
              else
                echo "❌ All linking methods failed"
                echo "💡 Troubleshooting tips:"
                echo "  - Verify SUPABASE_PROJECT_ID: $SUPABASE_PROJECT_ID"
                echo "  - Check if database password is correct"
                echo "  - Ensure project exists and is accessible"
                echo "  - Try resetting database password in Supabase dashboard"
                exit 1
              fi
            fi
          fi
          
          # Verify the link was successful
          if [ ! -f ".supabase/config.toml" ] || ! grep -q "project_id" ".supabase/config.toml" 2>/dev/null; then
            echo "⚠️ Link verification failed, but continuing..."
          fi
          
          # Check migration status before applying
          echo "📋 Checking current migration status..."
          supabase migration list --linked 2>/dev/null || echo "⚠️ Could not list migrations (this might be normal for first run)"
          
          # Apply migrations with multiple fallback methods
          echo "🔄 Applying migrations..."
          
          # Method 1: Standard db push
          if supabase db push --linked 2>/dev/null; then
            echo "✅ Migrations applied successfully!"
          else
            echo "⚠️ Standard push failed, trying alternative methods..."
            
            # Method 2: Try with password environment variable
            export PGPASSWORD="$SUPABASE_DB_PASSWORD"
            if supabase db push --linked 2>/dev/null; then
              echo "✅ Migrations applied successfully (Method 2)!"
            else
              echo "⚠️ Method 2 failed, trying Method 3..."
              
              # Method 3: Try applying migrations individually via SQL
              echo "🔄 Applying migrations individually..."
              
              migration_success=true
              for migration_file in supabase/migrations/*.sql; do
                if [ -f "$migration_file" ]; then
                  migration_name=$(basename "$migration_file")
                  echo "📄 Processing migration: $migration_name"
                  
                  # Try to apply via psql if available
                  if command -v psql >/dev/null 2>&1; then
                    # Construct connection string
                    DB_HOST="aws-0-eu-central-1.pooler.supabase.com"
                    DB_USER="postgres.$(echo $SUPABASE_PROJECT_ID | cut -c1-20)"
                    DB_NAME="postgres"
                    
                    if PGPASSWORD="$SUPABASE_DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -f "$migration_file" 2>/dev/null; then
                      echo "✅ Applied migration: $migration_name"
                    else
                      echo "❌ Failed to apply migration: $migration_name"
                      migration_success=false
                    fi
                  else
                    echo "⚠️ psql not available, cannot apply individual migrations"
                    migration_success=false
                    break
                  fi
                fi
              done
              
              if [ "$migration_success" = true ]; then
                echo "✅ All migrations applied successfully via individual method!"
              else
                echo "❌ Failed to apply migrations via all methods"
                exit 1
              fi
            fi
          fi
          
          # Show final migration status
          echo "📋 Final migration status:"
          supabase migration list --linked 2>/dev/null || echo "⚠️ Could not list final migration status"
          
          echo "🎉 Migration deployment completed!"

      - name: Install expect for interactive prompts
        if: steps.check-migrations.outputs.migrations_exist == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y expect postgresql-client

      - name: No migrations to deploy
        if: steps.check-migrations.outputs.migrations_exist == 'false'
        run: |
          echo "ℹ️ No migrations found in supabase/migrations directory."
          echo "This workflow will only run when there are migration files to deploy."

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Migration deployment failed!"
          echo ""
          echo "🔍 Please check the following:"
          echo ""
          echo "1. GitHub Secrets Configuration:"
          echo "   - SUPABASE_ACCESS_TOKEN: Get from https://supabase.com/dashboard/account/tokens"
          echo "   - SUPABASE_PROJECT_ID: Found in your project settings"
          echo "   - SUPABASE_DB_PASSWORD: Your database password"
          echo ""
          echo "2. Database Password Reset:"
          echo "   - Go to https://supabase.com/dashboard/project/${{ secrets.SUPABASE_PROJECT_ID }}/settings/database"
          echo "   - Click 'Reset database password'"
          echo "   - Copy the new password"
          echo "   - Update the SUPABASE_DB_PASSWORD secret in GitHub"
          echo ""
          echo "3. Project Access:"
          echo "   - Ensure your access token has the correct permissions"
          echo "   - Verify the project ID is correct: ${{ secrets.SUPABASE_PROJECT_ID }}"
          echo ""
          echo "4. Migration Files:"
          echo "   - Check for SQL syntax errors"
          echo "   - Ensure migrations are compatible with your current schema"
          echo ""
          echo "5. Alternative Solution:"
          echo "   - You can manually apply migrations via the Supabase dashboard"
          echo "   - Go to SQL Editor and run the migration files manually"
