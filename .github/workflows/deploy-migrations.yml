name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy-migrations:
    name: Deploy Supabase Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check if migrations directory exists
        id: check-migrations
        run: |
          if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations)" ]; then
            echo "migrations_exist=true" >> $GITHUB_OUTPUT
            echo "Migrations directory exists and is not empty"
            echo "📁 Found migrations:"
            ls -la supabase/migrations/
          else
            echo "migrations_exist=false" >> $GITHUB_OUTPUT
            echo "Migrations directory is empty or doesn't exist"
          fi

      - name: Deploy Migrations
        if: steps.check-migrations.outputs.migrations_exist == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🚀 Starting migration deployment..."
          
          # Link to the remote project
          echo "🔗 Linking to Supabase project..."
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to link to Supabase project"
            exit 1
          fi
          
          echo "✅ Successfully linked to project"
          
          # Check migration status before applying
          echo "📋 Checking current migration status..."
          supabase migration list --linked
          
          # Apply migrations
          echo "🔄 Applying migrations..."
          supabase db push --linked
          
          if [ $? -eq 0 ]; then
            echo "✅ Migrations applied successfully!"
            
            # Show final migration status
            echo "📋 Final migration status:"
            supabase migration list --linked
            
            echo "🎉 Migration deployment completed!"
          else
            echo "❌ Failed to apply migrations"
            
            # Show error details
            echo "📋 Current migration status:"
            supabase migration list --linked
            
            exit 1
          fi

      - name: No migrations to deploy
        if: steps.check-migrations.outputs.migrations_exist == 'false'
        run: |
          echo "ℹ️ No migrations found in supabase/migrations directory."
          echo "This workflow will only run when there are migration files to deploy."

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Migration deployment failed!"
          echo "Please check the logs above for error details."
          echo "Common issues:"
          echo "  - Missing or incorrect SUPABASE_ACCESS_TOKEN"
          echo "  - Missing or incorrect SUPABASE_PROJECT_ID"
          echo "  - Missing or incorrect SUPABASE_DB_PASSWORD"
          echo "  - Migration syntax errors"
          echo "  - Database connection issues"
